[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "openmalaria"
version = "0.3.0"
description = "Minimal nanobind Python bindings for OpenMalaria"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy>=1.20", "pandas>=1.3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
cmake.source-dir = "core"
cmake.build-type = "Release"
wheel.packages = ["src/openmalaria"]

[tool.scikit-build.cmake.define]
OM_BUILD_PYTHON = "ON"
OM_CXXTEST_ENABLE = "OFF"
OM_BOXTEST_ENABLE = "OFF"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1; python_version >= '3.10'",
    "pandas-stubs",
    "pytest>=8",
    "ruff>=0.16.8",
]

[tool.ruff]
extend-exclude = ["core", "src/openmalaria/_openmalaria.pyi"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.9"
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnannotatedClassAttribute = false
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
reportImplicitOverride = false

[tool.pytest.ini_options]
testpaths = ["tests"]
